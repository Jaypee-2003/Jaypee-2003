<svg xmlns="http://www.w3.org/2000/svg" width="880" height="238" viewBox="0 0 880 238" role="img" aria-label="Dukaan Dost architecture: admin, staff and vendor users call a Node.js and Express REST API with JWT on every request and RBAC per role. It serves inventory, orders, vendors and tasks modules backed by Redis (30–40% faster responses) and an indexed MongoDB, all running on Docker Compose."><title>Dukaan Dost architecture: admin, staff and vendor users call a Node.js and Express REST API with JWT on every request and RBAC per role. It serves inventory, orders, vendors and tasks modules backed by Redis (30–40% faster responses) and an indexed MongoDB, all running on Docker Compose.</title><rect x="0.5" y="0.5" width="879" height="237" rx="14" fill="#151A21" stroke="#2B323C"/><text x="36" y="42" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8EA6FF" font-weight="600" letter-spacing="1.5">DUKAAN DOST · HOW THE PLATFORM FITS TOGETHER</text><rect x="214" y="64" width="638" height="150" rx="12" fill="none" stroke="#F2AA5C" stroke-opacity="0.6" stroke-dasharray="5 5"/><rect x="226" y="57" width="118" height="15" fill="#151A21"/><text x="232" y="68" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#F2AA5C" font-weight="600" letter-spacing="1.2">DOCKER COMPOSE</text><text x="36" y="88" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E" font-weight="600" letter-spacing="1.2">USERS</text><rect x="36" y="98" width="140" height="28" rx="8" fill="#1C232C" stroke="#2B323C"/><circle cx="52" cy="112" r="3.5" fill="#8EA6FF"/><text x="64" y="117" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#ECEFF3" font-weight="500">Admin</text><rect x="36" y="134" width="140" height="28" rx="8" fill="#1C232C" s